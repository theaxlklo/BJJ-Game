name: Godot V1 headless checks

on:
  workflow_call:
    inputs:
      target_sha:
        required: true
        type: string

permissions:
  contents: read

jobs:
  godot-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}

      - name: Install pinned Godot 4.7.2 standard edition
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://downloads.godotengine.org/?version=4.7.2&flavor=stable&platform=linux.64&slug=linux.x86_64.zip" \
            --output /tmp/godot.zip
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip" | sha256sum --check
          unzip -q /tmp/godot.zip -d /tmp/godot-binary
          binary="$(find /tmp/godot-binary -maxdepth 1 -type f -name 'Godot*' | head -n 1)"
          test -n "$binary"
          sudo install -m 0755 "$binary" /usr/local/bin/godot
          godot --headless --version

      - name: Import and validate Godot project
        run: godot --headless --path GODOT_V1 --editor --import --quit

      - name: Run frozen Mount-slice tests
        shell: bash
        run: |
          set -euo pipefail
          # A production assert aborts only one test function: Godot can still print
          # PASS with fewer assertions and exit 0. Validate status and the whole log.
          # The pinned count changes only with reviewed test_mount_slice.gd changes.
          status=0
          godot --headless --path GODOT_V1 --script res://tests/test_mount_slice.gd > /tmp/mount-slice.log 2>&1 || status=$?
          cat /tmp/mount-slice.log
          python tools/ci/validate_mount_slice_log.py /tmp/mount-slice.log --exit-code "$status" --expected-assertions 256992

      - name: Generate reference results using original Python engine
        run: PYTHONPATH=src python GODOT_V1/tests/generate_mount_reference.py

      - name: Compare GDScript results against Python reference
        run: godot --headless --path GODOT_V1 --script res://tests/test_mount_reference.gd

      - name: Generate stamina fixtures using original Python contracts
        run: PYTHONPATH=src python GODOT_V1/tests/generate_stamina_reference.py

      - name: Compare stamina, commitment, behavior and exhaustion against Python
        run: godot --headless --path GODOT_V1 --script res://tests/test_stamina_reference.gd

      - name: Run native stamina rejection and boundary tests
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path GODOT_V1 --script res://tests/test_stamina_boundaries.gd 2>&1 | tee /tmp/stamina-native.log
          python - <<'PY'
          from pathlib import Path
          errors = [line for line in Path('/tmp/stamina-native.log').read_text().splitlines()
                    if line.startswith('ERROR:') or 'SCRIPT ERROR:' in line]
          assert len(errors) == 2 and all(line.startswith('ERROR: read_only_property:') for line in errors), errors
          PY

      - name: Generate exchange fixtures using unchanged MountMatch.attempt
        run: PYTHONPATH=src python GODOT_V1/tests/generate_exchange_reference.py

      - name: Run native exchange admission, ordering and settlement controls
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path GODOT_V1 --script res://tests/test_exchange_boundaries.gd 2>&1 | tee /tmp/exchange-native.log
          python - <<'PY'
          from pathlib import Path
          lines = Path('/tmp/exchange-native.log').read_text().splitlines()
          errors = [line for line in lines if line.startswith(('ERROR:', 'WARNING:')) or 'SCRIPT ERROR:' in line]
          assert not errors, errors
          PY

      - name: Compare exchange results, histories and deterministic replay against Python
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path GODOT_V1 --script res://tests/test_exchange_reference.gd 2>&1 | tee /tmp/exchange-parity.log
          python - <<'PY'
          from pathlib import Path
          lines = Path('/tmp/exchange-parity.log').read_text().splitlines()
          errors = [line for line in lines if line.startswith(('ERROR:', 'WARNING:')) or 'SCRIPT ERROR:' in line]
          assert not errors, errors
          PY

      - name: Generate Mount advancement trajectories from Python
        run: PYTHONPATH=src python GODOT_V1/tests/generate_mount_lifecycle_reference.py

      - name: Validate Mount lifecycle boundaries and replay trajectories
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path GODOT_V1 --script res://tests/test_mount_lifecycle_boundaries.gd 2>&1 | tee /tmp/mount-lifecycle-native.log
          godot --headless --path GODOT_V1 --script res://tests/test_mount_lifecycle_reference.gd 2>&1 | tee /tmp/mount-lifecycle-parity.log
          python - <<'PY'
          from pathlib import Path
          for name in ('native', 'parity'):
              lines = Path('/tmp/mount-lifecycle-' + name + '.log').read_text().splitlines()
              errors = [line for line in lines if line.startswith(('ERROR:', 'WARNING:')) or 'SCRIPT ERROR:' in line]
              assert not errors, errors
          PY

      - name: Generate D3-B and integrated Mount lifecycle trajectories from Python
        run: PYTHONPATH=src python GODOT_V1/tests/generate_d3b_reference.py

      - name: Validate D3-B boundaries and integrated Mount replay parity
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path GODOT_V1 --script res://tests/test_d3b_boundaries.gd 2>&1 | tee /tmp/d3b-native.log
          godot --headless --path GODOT_V1 --script res://tests/test_d3b_reference.gd 2>&1 | tee /tmp/d3b-parity.log
          python - <<'PY'
          from pathlib import Path
          for name in ('native', 'parity'):
              lines = Path('/tmp/d3b-' + name + '.log').read_text().splitlines()
              errors = [line for line in lines if line.startswith(('ERROR:', 'WARNING:')) or 'SCRIPT ERROR:' in line]
              assert not errors, errors
          PY

      - name: Validate PositionContract boundaries and replay the Python exchange oracle through the Mount adapter
        shell: bash
        run: |
          set -euo pipefail
          # Reuses exchange_reference.jsonl generated above by the unchanged Python engine.
          godot --headless --path GODOT_V1 --script res://tests/test_position_contract_boundaries.gd 2>&1 | tee /tmp/position-contract-native.log
          godot --headless --path GODOT_V1 --script res://tests/test_position_contract_reference.gd 2>&1 | tee /tmp/position-contract-parity.log
          python - <<'PY'
          from pathlib import Path
          for name in ('native', 'parity'):
              lines = Path('/tmp/position-contract-' + name + '.log').read_text().splitlines()
              errors = [line for line in lines if line.startswith(('ERROR:', 'WARNING:')) or 'SCRIPT ERROR:' in line]
              assert not errors, errors
          PY

      - name: Validate Match Window Gateway admission and lockstep replay against unchanged Mount entry points
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path GODOT_V1 --script res://tests/test_window_gateway_boundaries.gd 2>&1 | tee /tmp/window-gateway-native.log
          python - <<'PY'
          from pathlib import Path
          lines = Path('/tmp/window-gateway-native.log').read_text().splitlines()
          errors = [line for line in lines if line.startswith(('ERROR:', 'WARNING:')) or 'SCRIPT ERROR:' in line]
          assert not errors, errors
          PY

      - name: Validate Position Graph coordinator halts, atomicity and lockstep replay against the bare gateway
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path GODOT_V1 --script res://tests/test_position_graph_boundaries.gd 2>&1 | tee /tmp/position-graph-native.log
          python - <<'PY'
          from pathlib import Path
          lines = Path('/tmp/position-graph-native.log').read_text().splitlines()
          errors = [line for line in lines if line.startswith(('ERROR:', 'WARNING:')) or 'SCRIPT ERROR:' in line]
          assert not errors, errors
          PY

      - name: Validate position-aware exit classification fails closed and stays isolated from Mount
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path GODOT_V1 --script res://tests/test_position_graph_classification.gd 2>&1 | tee /tmp/position-graph-classification.log
          python - <<'PY'
          from pathlib import Path
          lines = Path('/tmp/position-graph-classification.log').read_text().splitlines()
          errors = [line for line in lines if line.startswith(('ERROR:', 'WARNING:')) or 'SCRIPT ERROR:' in line]
          assert not errors, errors
          PY

      - name: Validate position-independent commitment settlement helpers against literal tables
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path GODOT_V1 --script res://tests/test_commitment_settlement.gd 2>&1 | tee /tmp/commitment-settlement-native.log
          python - <<'PY'
          from pathlib import Path
          lines = Path('/tmp/commitment-settlement-native.log').read_text().splitlines()
          errors = [line for line in lines if line.startswith(('ERROR:', 'WARNING:')) or 'SCRIPT ERROR:' in line]
          assert not errors, errors
          PY

      - name: Validate detached Mount carry-over export (schema, validation, non-mutation)
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path GODOT_V1 --script res://tests/test_carryover_export.gd 2>&1 | tee /tmp/carryover-export-native.log
          python - <<'PY'
          from pathlib import Path
          lines = Path('/tmp/carryover-export-native.log').read_text().splitlines()
          errors = [line for line in lines if line.startswith(('ERROR:', 'WARNING:')) or 'SCRIPT ERROR:' in line]
          assert not errors, errors
          PY

      - name: Validate canonical position registry (identity only) and its Mount integration
        shell: bash
        run: |
          set -euo pipefail
          # Same false-success guard as the Mount-slice step: validate status and the whole log.
          # The pinned count changes only with a reviewed test_position_registry.gd change.
          status=0
          godot --headless --path GODOT_V1 --script res://tests/test_position_registry.gd > /tmp/position-registry.log 2>&1 || status=$?
          cat /tmp/position-registry.log
          python tools/ci/validate_mount_slice_log.py /tmp/position-registry.log --name "Position registry" --exit-code "$status" --expected-assertions 431

      - name: Validate fighter definitions and read-only fighter snapshots over the Mount gateway
        shell: bash
        run: |
          set -euo pipefail
          # Same false-success guard as the Mount-slice step: validate status and the whole log.
          # The pinned count changes only with a reviewed test_fighter_foundation.gd change.
          status=0
          godot --headless --path GODOT_V1 --script res://tests/test_fighter_foundation.gd > /tmp/fighter-foundation.log 2>&1 || status=$?
          cat /tmp/fighter-foundation.log
          python tools/ci/validate_mount_slice_log.py /tmp/fighter-foundation.log --name "Fighter foundation" --exit-code "$status" --expected-assertions 750

      - name: Validate the 2D Mount practice scene, its controller and the graph-backed fighter snapshots
        shell: bash
        run: |
          set -euo pipefail
          # Same false-success guard as the Mount-slice step: validate status and the whole log.
          # The pinned count changes only with a reviewed test_mount_practice.gd change.
          status=0
          godot --headless --path GODOT_V1 --script res://tests/test_mount_practice.gd > /tmp/mount-practice.log 2>&1 || status=$?
          cat /tmp/mount-practice.log
          python tools/ci/validate_mount_slice_log.py /tmp/mount-practice.log --name "Mount practice" --exit-code "$status" --expected-assertions 1036

      - name: Generate the independent Half Guard Python oracle fixture
        shell: bash
        run: |
          set -euo pipefail
          # Standard-library oracle (tests/oracles/half_guard_v0.py); no engine code and no Mount code is imported.
          python GODOT_V1/tests/generate_half_guard_reference.py

      - name: Validate Half Guard v0 boundaries (negative-first typed engine tests)
        shell: bash
        run: |
          set -euo pipefail
          # Same false-success guard as the Mount-slice step: validate status and the whole log.
          # The pinned count changes only with a reviewed test_half_guard_boundaries.gd change.
          status=0
          godot --headless --path GODOT_V1 --script res://tests/test_half_guard_boundaries.gd > /tmp/half-guard-boundaries.log 2>&1 || status=$?
          cat /tmp/half-guard-boundaries.log
          python tools/ci/validate_mount_slice_log.py /tmp/half-guard-boundaries.log --name "Half Guard boundaries" --exit-code "$status" --expected-assertions 4006

      - name: Validate Half Guard v0 against the independent Python oracle (fixture replay)
        shell: bash
        run: |
          set -euo pipefail
          # Same false-success guard as the Mount-slice step: validate status and the whole log.
          # The pinned count changes only with a reviewed test_half_guard_reference.gd or oracle change.
          status=0
          godot --headless --path GODOT_V1 --script res://tests/test_half_guard_reference.gd > /tmp/half-guard-reference.log 2>&1 || status=$?
          cat /tmp/half-guard-reference.log
          python tools/ci/validate_mount_slice_log.py /tmp/half-guard-reference.log --name "Half Guard reference" --exit-code "$status" --expected-assertions 49609

      - name: Validate Half Guard v0 window-gateway conformance to the Mount gateway
        shell: bash
        run: |
          set -euo pipefail
          # Same false-success guard as the Mount-slice step: validate status and the whole log.
          # The pinned count changes only with a reviewed test_half_guard_conformance.gd change.
          status=0
          godot --headless --path GODOT_V1 --script res://tests/test_half_guard_conformance.gd > /tmp/half-guard-conformance.log 2>&1 || status=$?
          cat /tmp/half-guard-conformance.log
          python tools/ci/validate_mount_slice_log.py /tmp/half-guard-conformance.log --name "Half Guard conformance" --exit-code "$status" --expected-assertions 151

      - name: Validate the Half Guard v0 Mount edge adapter (carry-over record to entry request)
        shell: bash
        run: |
          set -euo pipefail
          # Same false-success guard as the Mount-slice step: validate status and the whole log.
          # The pinned count changes only with a reviewed test_half_guard_mount_edge.gd change.
          status=0
          godot --headless --path GODOT_V1 --script res://tests/test_half_guard_mount_edge.gd > /tmp/half-guard-mount-edge.log 2>&1 || status=$?
          cat /tmp/half-guard-mount-edge.log
          python tools/ci/validate_mount_slice_log.py /tmp/half-guard-mount-edge.log --name "Half Guard Mount edge" --exit-code "$status" --expected-assertions 3119

      - name: Validate the opt-in Mount to Half Guard graph integration (receiver table, atomic commit, halt semantics)
        shell: bash
        run: |
          set -euo pipefail
          # Same false-success guard as the Mount-slice step: validate status and the whole log.
          # The pinned count changes only with a reviewed test_half_guard_graph.gd change.
          status=0
          godot --headless --path GODOT_V1 --script res://tests/test_half_guard_graph.gd > /tmp/half-guard-graph.log 2>&1 || status=$?
          cat /tmp/half-guard-graph.log
          python tools/ci/validate_mount_slice_log.py /tmp/half-guard-graph.log --name "Half Guard graph" --exit-code "$status" --expected-assertions 2125

      - name: Validate the Half Guard sealed-intent protocol (seal, respond, refusals, redaction, oracle compatibility)
        shell: bash
        run: |
          set -euo pipefail
          # Same false-success guard as the Mount-slice step: validate status and the whole log.
          # The pinned count changes only with a reviewed test_half_guard_sealed_protocol.gd change.
          status=0
          godot --headless --path GODOT_V1 --script res://tests/test_half_guard_sealed_protocol.gd > /tmp/half-guard-sealed-protocol.log 2>&1 || status=$?
          cat /tmp/half-guard-sealed-protocol.log
          python tools/ci/validate_mount_slice_log.py /tmp/half-guard-sealed-protocol.log --name "Half Guard sealed protocol" --exit-code "$status" --expected-assertions 41231

      - name: Smoke-test the default scene (2D Mount practice; the 3D greybox stays a separate diagnostic scene)
        run: godot --headless --path GODOT_V1 --quit-after 5
