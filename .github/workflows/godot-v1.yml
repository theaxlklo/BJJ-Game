name: Godot V1 headless checks

on:
  workflow_call:
    inputs:
      target_sha:
        required: true
        type: string

permissions:
  contents: read

jobs:
  godot-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}

      - name: Install pinned Godot 4.7.2 standard edition
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://downloads.godotengine.org/?version=4.7.2&flavor=stable&platform=linux.64&slug=linux.x86_64.zip" \
            --output /tmp/godot.zip
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip" | sha256sum --check
          unzip -q /tmp/godot.zip -d /tmp/godot-binary
          binary="$(find /tmp/godot-binary -maxdepth 1 -type f -name 'Godot*' | head -n 1)"
          test -n "$binary"
          sudo install -m 0755 "$binary" /usr/local/bin/godot
          godot --headless --version

      - name: Import and validate Godot project
        run: godot --headless --path GODOT_V1 --editor --import --quit

      - name: Run frozen Mount-slice tests
        run: godot --headless --path GODOT_V1 --script res://tests/test_mount_slice.gd

      - name: Generate reference results using original Python engine
        run: PYTHONPATH=src python GODOT_V1/tests/generate_mount_reference.py

      - name: Compare GDScript results against Python reference
        run: godot --headless --path GODOT_V1 --script res://tests/test_mount_reference.gd

      - name: Generate stamina fixtures using original Python contracts
        run: PYTHONPATH=src python GODOT_V1/tests/generate_stamina_reference.py

      - name: Compare stamina, commitment, behavior and exhaustion against Python
        run: godot --headless --path GODOT_V1 --script res://tests/test_stamina_reference.gd

      - name: Run native stamina rejection and boundary tests
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path GODOT_V1 --script res://tests/test_stamina_boundaries.gd 2>&1 | tee /tmp/stamina-native.log
          python - <<'PY'
          from pathlib import Path
          errors = [line for line in Path('/tmp/stamina-native.log').read_text().splitlines()
                    if line.startswith('ERROR:') or 'SCRIPT ERROR:' in line]
          assert len(errors) == 2 and all(line.startswith('ERROR: read_only_property:') for line in errors), errors
          PY

      - name: Generate exchange fixtures using unchanged MountMatch.attempt
        run: PYTHONPATH=src python GODOT_V1/tests/generate_exchange_reference.py

      - name: Run native exchange admission, ordering and settlement controls
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path GODOT_V1 --script res://tests/test_exchange_boundaries.gd 2>&1 | tee /tmp/exchange-native.log
          python - <<'PY'
          from pathlib import Path
          lines = Path('/tmp/exchange-native.log').read_text().splitlines()
          errors = [line for line in lines if line.startswith(('ERROR:', 'WARNING:')) or 'SCRIPT ERROR:' in line]
          assert not errors, errors
          PY

      - name: Compare exchange results, histories and deterministic replay against Python
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path GODOT_V1 --script res://tests/test_exchange_reference.gd 2>&1 | tee /tmp/exchange-parity.log
          python - <<'PY'
          from pathlib import Path
          lines = Path('/tmp/exchange-parity.log').read_text().splitlines()
          errors = [line for line in lines if line.startswith(('ERROR:', 'WARNING:')) or 'SCRIPT ERROR:' in line]
          assert not errors, errors
          PY

      - name: Generate Mount advancement trajectories from Python
        run: PYTHONPATH=src python GODOT_V1/tests/generate_mount_lifecycle_reference.py

      - name: Validate Mount lifecycle boundaries and replay trajectories
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path GODOT_V1 --script res://tests/test_mount_lifecycle_boundaries.gd 2>&1 | tee /tmp/mount-lifecycle-native.log
          godot --headless --path GODOT_V1 --script res://tests/test_mount_lifecycle_reference.gd 2>&1 | tee /tmp/mount-lifecycle-parity.log
          python - <<'PY'
          from pathlib import Path
          for name in ('native', 'parity'):
              lines = Path('/tmp/mount-lifecycle-' + name + '.log').read_text().splitlines()
              errors = [line for line in lines if line.startswith(('ERROR:', 'WARNING:')) or 'SCRIPT ERROR:' in line]
              assert not errors, errors
          PY

      - name: Generate D3-B and integrated Mount lifecycle trajectories from Python
        run: PYTHONPATH=src python GODOT_V1/tests/generate_d3b_reference.py

      - name: Validate D3-B boundaries and integrated Mount replay parity
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path GODOT_V1 --script res://tests/test_d3b_boundaries.gd 2>&1 | tee /tmp/d3b-native.log
          godot --headless --path GODOT_V1 --script res://tests/test_d3b_reference.gd 2>&1 | tee /tmp/d3b-parity.log
          python - <<'PY'
          from pathlib import Path
          for name in ('native', 'parity'):
              lines = Path('/tmp/d3b-' + name + '.log').read_text().splitlines()
              errors = [line for line in lines if line.startswith(('ERROR:', 'WARNING:')) or 'SCRIPT ERROR:' in line]
              assert not errors, errors
          PY

      - name: Smoke-test minimal 3D scene
        run: godot --headless --path GODOT_V1 --quit-after 5
