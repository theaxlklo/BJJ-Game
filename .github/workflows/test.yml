name: test

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit and regression tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Verify frozen enumerate digest
        shell: bash
        run: |
          expected="3ee55429434f8f95c592183317292d3e824768135d7834c44bae82a6c1a59ff2"
          actual="$(PYTHONPATH=src python -m bjj_game --enumerate | sha256sum | awk '{print $1}')"
          echo "expected=$expected"
          echo "actual=$actual"
          test "$actual" = "$expected"
      - name: Run semantic checker
        run: PYTHONPATH=src python -m bjj_game --check
      - name: Verify legacy entry point
        run: PYTHONPATH=src python -m mount_v0 --check
