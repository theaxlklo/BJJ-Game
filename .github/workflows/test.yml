name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact 40-character SHA of selected branch head
        required: true
        type: string
      full_qualification:
        description: Run full Python and Godot qualification
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'automatic' }}
  cancel-in-progress: true

jobs:
  classify:
    name: ${{ github.event_name == 'workflow_dispatch' && 'Manual admission' || 'classify changes' }}
    runs-on: ubuntu-latest
    outputs:
      python_required: ${{ steps.changes.outputs.python_required }}
      godot_required: ${{ steps.changes.outputs.godot_required }}
      target_sha: ${{ steps.changes.outputs.target_sha }}
      diff_span: ${{ steps.changes.outputs.diff_span }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Test routing false-negative regressions
        run: python -m unittest discover -s tools/ci -v
      - id: changes
        name: Classify changed paths and pin event head
        run: python tools/ci/route.py

  lightweight-validation:
    name: lightweight validation
    needs: classify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.classify.outputs.target_sha }}
          fetch-depth: 0
      - name: Check changed lines without treating a shallow commit as a root
        env:
          DIFF_SPAN: ${{ needs.classify.outputs.diff_span }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$DIFF_SPAN" ]]; then
            # Markdown hard breaks are intentional trailing spaces.
            git -c core.whitespace=blank-at-eof,space-before-tab diff --check "$DIFF_SPAN"
          else
            git -c core.whitespace=blank-at-eof,space-before-tab show --format= --check HEAD
          fi

  godot:
    name: Godot qualification
    needs: classify
    if: needs.classify.outputs.godot_required == 'true'
    uses: ./.github/workflows/godot-v1.yml
    with:
      target_sha: ${{ needs.classify.outputs.target_sha }}

  unit-tests:
    name: unit-tests (${{ matrix.python-version }}, shard ${{ matrix.shard }})
    needs: classify
    if: needs.classify.outputs.python_required == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.classify.outputs.target_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run deterministic unittest shard
        shell: bash
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: "6"
        run: |
          set -euo pipefail
          PYTHONPATH=src python - <<'PY'
          import os
          import sys
          import unittest

          shard_index = int(os.environ["SHARD_INDEX"])
          shard_count = int(os.environ["SHARD_COUNT"])

          def flatten(suite):
              for item in suite:
                  if isinstance(item, unittest.TestSuite):
                      yield from flatten(item)
                  else:
                      yield item

          discovered = unittest.defaultTestLoader.discover("tests")
          tests = sorted(flatten(discovered), key=lambda test: test.id())
          selected = [
              test
              for index, test in enumerate(tests)
              if index % shard_count == shard_index
          ]

          print(
              f"discovered={len(tests)} "
              f"shard={shard_index}/{shard_count} "
              f"selected={len(selected)}"
          )
          for test in selected:
              print(f"  {test.id()}")

          if not selected:
              raise SystemExit(0)

          result = unittest.TextTestRunner(verbosity=2).run(
              unittest.TestSuite(selected)
          )
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY

  verification:
    name: verification (${{ matrix.python-version }})
    needs: classify
    if: needs.classify.outputs.python_required == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.classify.outputs.target_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify frozen enumerate digest
        shell: bash
        run: |
          expected="3ee55429434f8f95c592183317292d3e824768135d7834c44bae82a6c1a59ff2"
          actual="$(PYTHONPATH=src python -m bjj_game --enumerate | sha256sum | awk '{print $1}')"
          echo "expected=$expected"
          echo "actual=$actual"
          test "$actual" = "$expected"

      - name: Run semantic checker
        run: PYTHONPATH=src python -m bjj_game --check

      - name: Verify legacy entry point
        run: PYTHONPATH=src python -m mount_v0 --check

  history-verification:
    name: historical verification (${{ matrix.python-version }})
    needs: classify
    if: needs.classify.outputs.python_required == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.classify.outputs.target_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run git-history invariants (fails instead of skipping)
        env:
          BJJ_REQUIRE_GIT_HISTORY: "1"
        run: >-
          PYTHONPATH=src python -m unittest -v
          tests.test_d3b_promotion_verification.D3BPromotionVerificationTests.test_pg8_nothing_bundled

  ci-gate:
    name: ${{ github.event_name == 'workflow_dispatch' && 'Manual qualification gate' || 'CI gate' }}
    if: always()
    needs: [classify, lightweight-validation, godot, unit-tests, verification, history-verification]
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected qualification
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          LIGHT_RESULT: ${{ needs.lightweight-validation.result }}
          PYTHON_REQUIRED: ${{ needs.classify.outputs.python_required }}
          GODOT_REQUIRED: ${{ needs.classify.outputs.godot_required }}
          GODOT_RESULT: ${{ needs.godot.result }}
          UNIT_RESULT: ${{ needs.unit-tests.result }}
          VERIFY_RESULT: ${{ needs.verification.result }}
          HISTORY_RESULT: ${{ needs.history-verification.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CLASSIFY_RESULT" = success
          test "$LIGHT_RESULT" = success
          case "$PYTHON_REQUIRED" in
            true) expected=success ;;
            false) expected=skipped ;;
            *) exit 1 ;;
          esac
          test "$UNIT_RESULT" = "$expected"
          test "$VERIFY_RESULT" = "$expected"
          test "$HISTORY_RESULT" = "$expected"
          case "$GODOT_REQUIRED" in
            true) test "$GODOT_RESULT" = success ;;
            false) test "$GODOT_RESULT" = skipped ;;
            *) exit 1 ;;
          esac
          echo "CI gate PASS: all selected qualifications succeeded for this event head."
